
name: RideHailing CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode clean verify

      - name: Collect Java dependencies for analysis
        if: vars.SONAR_ENABLED == 'true'
        working-directory: backend
        run: mvn --batch-mode dependency:copy-dependencies

      - name: Upload backend analysis inputs
        if: vars.SONAR_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-analysis
          retention-days: 1
          if-no-files-found: error
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/sonar-libraries/
            backend/target/site/jacoco/jacoco.xml
            backend/target/surefire-reports/*.xml

  frontend-build-and-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: vars.SONAR_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          retention-days: 1
          if-no-files-found: error
          path: frontend/coverage/lcov.info

  sonarqube:
    name: SonarQube Quality Gate
    needs: [build-and-test, frontend-build-and-test]
    # Fork and Dependabot PRs have no access to the Cloud analysis secret.
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Cloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          for setting in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting in the repository's Actions settings."
              exit 1
            fi
          done


      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download compiled Java code and coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-analysis
          path: backend/target

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  docker-build:
    name: Docker Image (${{ matrix.image }})
    needs: [build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./backend
            image: ridehailing
          - context: ./frontend
            image: ridehailing-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
