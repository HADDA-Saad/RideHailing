# One analysis includes both applications. Cloud identifiers are supplied by CI.
sonar.projectName=RideHailing
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/**/*.d.ts

# Java analysis needs the compiled classes and their dependencies.
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/sonar-libraries/*.jar
sonar.java.test.libraries=backend/target/sonar-libraries/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports

# Reports are produced by tests before the scanner runs.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
